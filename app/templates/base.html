<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Personal Finance Analytics{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container"><a class="navbar-brand fw-semibold" href="{{ url_for('web.dashboard') }}">Personal Finance Analytics</a><div class="navbar-nav ms-auto flex-row gap-3"><a class="nav-link" href="{{ url_for('web.dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('web.transactions') }}">Transactions</a><a class="nav-link" href="{{ url_for('web.budgets') }}">Budgets</a><a class="nav-link" href="{{ url_for('web.categories') }}">Categories</a><a class="nav-link" href="{{ url_for('web.import_data') }}">Import</a></div></div>
    </nav>
    <main class="container py-4">{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
