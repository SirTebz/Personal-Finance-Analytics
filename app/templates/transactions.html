{% extends "base.html" %}
{% block content %}<h1 class="h2 mb-4">Transactions</h1><div id="message"></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Add transaction</h2><form id="transaction-form" class="row g-3"><div class="col-md-3"><label class="form-label">Date<input class="form-control" required type="date" name="transaction_date"></label></div><div class="col-md-2"><label class="form-label">Type<select class="form-select" name="transaction_type"><option>Expense</option><option>Income</option></select></label></div><div class="col-md-3"><label class="form-label">Category<select class="form-select" required name="category_id" id="category"></select></label></div><div class="col-md-4"><label class="form-label">Description<input class="form-control" required name="description"></label></div><div class="col-md-3"><label class="form-label">Amount<input class="form-control" required min="0.01" step="0.01" type="number" name="amount"></label></div><div class="col-md-3"><label class="form-label">Payment method<input class="form-control" name="payment_method"></label></div><div class="col-md-6"><label class="form-label">Notes<input class="form-control" name="notes"></label></div><div class="col-12"><button class="btn btn-primary">Save transaction</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5">Recorded transactions</h2><a class="btn btn-outline-secondary btn-sm" href="/api/export/csv">Export CSV</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th class="text-end">Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>{% endblock %}
