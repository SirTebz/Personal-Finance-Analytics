{% extends "base.html" %}{% block content %}<h1 class="h2 mb-4">Budgets</h1><div id="message"></div><form class="card card-body border-0 shadow-sm row g-3 mb-4" id="budget-form"><div class="col-md-4"><label class="form-label">Expense category<select class="form-select" name="category_id" id="category"></select></label></div><div class="col-md-2"><label class="form-label">Month<input class="form-control" min="1" max="12" required type="number" name="month"></label></div><div class="col-md-3"><label class="form-label">Year<input class="form-control" min="2000" required type="number" name="year"></label></div><div class="col-md-3"><label class="form-label">Budget amount<input class="form-control" min="0" required step="0.01" type="number" name="amount"></label></div><div class="col-12"><button class="btn btn-primary">Save budget</button></div></form><div class="card border-0 shadow-sm"><div class="card-body"><table class="table"><thead><tr><th>Category</th><th>Period</th><th>Budget</th><th>Actual</th><th>Remaining</th><th>Used</th></tr></thead><tbody id="rows"></tbody></table></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/budgets.js') }}"></script>{% endblock %}
