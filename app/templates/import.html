{% extends "base.html" %}{% block content %}<h1 class="h2">Import data</h1><p class="text-secondary">Upload a UTF-8 CSV with: date, type, description, amount, category, payment_method, notes.</p><form id="import-form" class="card card-body border-0 shadow-sm"><label class="form-label">CSV file<input required class="form-control" type="file" accept=".csv" name="file"></label><button class="btn btn-primary mt-3">Validate and import</button></form><pre class="mt-4" id="result" aria-live="polite"></pre>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/import.js') }}"></script>{% endblock %}
